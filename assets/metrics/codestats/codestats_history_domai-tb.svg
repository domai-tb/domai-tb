<svg width="265" height="300" viewBox="0 0 265 300" fill="none" xmlns="http://www.w3.org/2000/svg"><style>
					.header {
						font: 600 18px &#x27;Segoe UI&#x27;, Ubuntu, Sans-Serif;
						fill: #3d858f;
						animation: fadeInAnimation 0.8s ease-in-out forwards;
					}
					
	.lang-name {
		font: 400 16px &#x27;Segoe UI&#x27;, Ubuntu, Sans-Serif;
		fill: #ffffffcc;
	}
	.xp-txt {
		font: 400 12px &#x27;Segoe UI&#x27;, Ubuntu, Sans-Serif;
		fill: black;
	}
	.xp-txt-invert {
		font: 600 12px &#x27;Segoe UI&#x27;, Ubuntu, Sans-Serif;
		fill: white;
	}
	.subtitle {
		font: 400 14px &#x27;Segoe UI&#x27;, Ubuntu, Sans-Serif;
		fill: #ffffffcc;
	}


					/* Animations */
					@keyframes scaleInAnimation {
						from {
							transform: translate(-5px, 5px) scale(0);
						}
						to {
							transform: translate(-5px, 5px) scale(1);
						}
					}
					@keyframes fadeInAnimation {
						from {
							opacity: 0;
						}
						to {
							opacity: 1;
						}
					}
				</style><rect x="0.5" y="0.5" rx="4.5" height="99%" stroke="#E4E2E2" width="264" fill="#151515" stroke-opacity="0"></rect><g transform="translate(25, 35)"><g transform="translate(0, 0)"><text x="0" y="0" class="header">Coding History of the last two weeks</text></g></g><g transform="translate(0, 55)"><svg x="25"><g transform="translate(0, 0)"></g><g transform="translate(85, 0)"><g transform="translate(0, 0)"><rect rx="5" x="2" y="7" height="12" width="12" fill="#3e4053"></rect><text x="18" y="18" class="lang-name">Other</text></g></g></svg></g></svg>